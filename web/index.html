<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <title>FTD Documentation Console</title>
    <!-- Theme before first paint: styles.css and the app arrive with the module graph, so this
         blocking script stamps <html data-theme> while the document is still being parsed, and the
         canvas colour below (= --bg in styles.css) covers the moment before the stylesheet lands. -->
    <style>
      html { background: #f4f6f8; }
      html[data-theme='dark'] { background: #0e141b; color-scheme: dark; }
    </style>
    <script>
      (function () {
        var theme = 'light';
        try {
          theme = localStorage.getItem('ftd-theme') || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        } catch (e) {}
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
