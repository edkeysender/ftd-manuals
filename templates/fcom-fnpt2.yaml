# Manual template: FCOM for FNPT II devices.
# The resolver walks this structure, includes every `shared` page unconditionally
# and every component whose id is installed on the simulator with a version
# matching one of the chunk's applies_to ranges. Components not installed are
# silently skipped; components installed but without a matching chunk fail the build.
id: fcom-fnpt2
title: Flight Crew Operating Manual
short: FCOM
chapters:
  - id: general
    title: General
    pages:
      - shared: general-info
      - generated: revision-register
      - generated: list-of-effective-sections
  - id: operations
    title: FNPT operations
    pages:
      - shared: health-and-safety
      - component: emergency-stop
      - component: starting-panel
      - component: instructor-seat
  - id: systems
    title: Systems description
    sections:
      - id: aft-overhead
        title: Aft overhead panel
        pages:
          - component: le-devices-annunciator
      - id: aft-electronic
        title: Aft electronic panel
        pages:
          - component: cargo-fire-panel
