# Manual template: FCOM for FNPT II devices.
# The resolver walks this structure, includes every `shared` page unconditionally
# and every module whose id is installed on the simulator with a version
# matching one of the chunk's applies_to ranges. Modules not installed are
# silently skipped; modules installed but without a matching chunk fail the build.
id: fcom-fnpt2
title: Flight Crew Operating Manual
short: FCOM
chapters:
  - id: general
    title: General
    pages:
      - shared: general-info
      - generated: table-of-contents
      - generated: revision-register
      - generated: list-of-effective-sections
  - id: operations
    title: FNPT operations
    pages:
      - shared: health-and-safety
      - module: emergency-stop
      - module: smoke-detector
      - module: starting-panel
      - module: starting-panel-error-codes
      - module: instructor-seat
      - module: jump-seat
  - id: systems
    title: Systems description
    sections:
      - id: aft-overhead
        title: Aft overhead panel
        pages:
          - module: le-devices-annunciator
      - id: aft-electronic
        title: Aft electronic panel
        pages:
          - module: cargo-fire-panel
      - id: circuit-breakers
        title: Circuit breakers
        pages:
          - module: circuit-breaker-wall
