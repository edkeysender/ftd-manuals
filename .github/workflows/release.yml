name: Release manuals

# Runs after a merge to main. Any manual whose content changed since its last release
# gets its revision bumped, its effective date stamped and a tag pushed. Manuals held
# by a gap or a broken link are skipped and reported in the job summary.
#
# Note: if branch protection on main requires reviews, the default GITHUB_TOKEN cannot
# push the version commit. Either allow the github-actions bot to bypass protection, or
# replace the token below with a PAT stored as secrets.RELEASE_TOKEN.

on:
  push:
    branches: [main]
    paths:
      - "components/**"
      - "shared/**"
      - "sims/**"
      - "templates/**"
      - "tools/**"
  workflow_dispatch:

concurrency:
  group: release-manuals
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0            # full history → revision register
          token: ${{ secrets.RELEASE_TOKEN || github.token }}

      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }

      - run: npm ci

      - name: Resolve every simulator configuration
        run: node tools/resolve.js --all

      - name: Decide which manuals need a revision
        run: node tools/bump.js --write --date "$(date -u +%F)"

      - name: Report
        run: |
          if [ ! -f dist/release.json ]; then
            echo "No manual needed a new revision." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "## Released"
            echo ""
            echo "| Serial | Issue.Rev | Effective | Tag |"
            echo "|---|---|---|---|"
            node -e '
              const r = require("./dist/release.json");
              for (const m of r.manuals) console.log(`| ${m.serial} | ${m.to} | ${m.effective_date} | \`${m.tag}\` |`);
            '
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit and tag
        run: |
          if [ ! -f dist/release.json ]; then exit 0; fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sims/
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          TAGS=$(node -e 'console.log(require("./dist/release.json").manuals.map(m => m.tag).join(" "))')
          git commit -m "Release: $TAGS

          Revision numbers, effective dates and content hashes written by tools/bump.js.
          Generated — do not edit these fields by hand."
          for t in $TAGS; do git tag -a "$t" -m "$t"; done
          git push origin HEAD:main
          git push origin $TAGS

      - name: Rebuild after the version bump
        run: npm run build

      - name: Upload released site
        uses: actions/upload-artifact@v4
        with: { name: released-site, path: build }

      # TODO: once tools/pdf.js and tools/bundle.js exist, build the PDF and the offline
      # bundle for each released manual here and attach them to a GitHub Release named
      # after the tag. That PDF is the CAA-controlled artefact.
